<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>동네배움터</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f9f6;color:#151b18;font-family:Arial,"Noto Sans KR",sans-serif}
header{height:68px;background:#fff;border-bottom:1px solid #eee}
.wrap{width:min(1240px,calc(100% - 48px));margin:auto}
header .wrap{height:100%;display:flex;align-items:center;justify-content:space-between}
.logo{color:#087a55;font-size:20px;font-weight:900}
nav{display:flex;gap:36px}
nav a{color:#737b76;text-decoration:none;font-size:14px}
nav a:first-child{color:#087a55;font-weight:bold}
main{padding:55px 0 80px}
.eyebrow{color:#087a55;font-size:14px;font-weight:bold}
h1{margin:12px 0 30px;font-size:42px}
.search{height:58px;display:flex;align-items:center;padding:0 18px;border:2px solid #087a55;border-radius:10px;background:#fff}
.search input{width:100%;border:0;outline:0;font-size:16px}
.chips{display:flex;gap:10px;margin:24px 0 38px}
.chip{padding:11px 18px;border:1px solid #dfe5e1;border-radius:99px;background:#fff;font-weight:bold}
.chip.active{background:#087a55;color:#fff;border-color:#087a55}
.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h2{font-size:20px}
.sort{color:#777;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{overflow:hidden;background:#fff;border-radius:16px;box-shadow:0 10px 24px #1f312717}
.card img{width:100%;height:194px;object-fit:cover}
.content{padding:18px}
.category{color:#087a55;font-size:12px;font-weight:bold}
h3{margin:8px 0 10px;font-size:18px}
.meta{color:#737b76;font-size:13px}
.price{font-size:18px;font-weight:900}
@media(max-width:800px){.cards{grid-template-columns:1fr}.wrap{width:calc(100% - 28px)}nav a:not(:first-child){display:none}h1{font-size:32px}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">동네배움터</div>
    <nav>
      <a href="#">클래스 찾기</a>
      <a href="#">클래스 열기</a>
      <a href="#">마이페이지</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <p class="eyebrow">내 주변에서 가볍게 시작해요</p>
  <h1>오늘은 무엇을 배워볼까요?</h1>

  <label class="search">
    🔍&nbsp;
    <input type="search" placeholder="클래스명이나 동네를 검색해 보세요" aria-label="클래스 검색">
  </label>

  <div class="chips">
    <button class="chip active">전체</button>
    <button class="chip">요리</button>
    <button class="chip">공예</button>
    <button class="chip">플라워</button>
    <button class="chip">건강</button>
  </div>

  <div class="heading">
    <h2>우리 동네 인기 클래스 12개</h2>
    <span class="sort">가까운 순⌄</span>
  </div>

  <section class="cards">
    <article class="card">
      <img
        src="https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=900&q=85"
        alt="진열대에 놓인 갓 구운 빵">
      <div class="content">
        <span class="category">베이킹</span>
        <h3>우리 동네 천연 발효빵 만들기</h3>
        <p class="meta">도보 8분 · 매주 토요일 10:00</p>
        <strong class="price">38,000원</strong>
      </div>
    </article>

    <article class="card">
      <img
        src="https://images.unsplash.com/photo-1452860606245-08befc0ff44b?auto=format&fit=crop&w=900&q=85"
        alt="작업대에서 라탄 공예를 하는 모습">
      <div class="content">
        <span class="category">공예</span>
        <h3>초보자를 위한 라탄 바구니</h3>
        <p class="meta">도보 12분 · 매주 금요일 19:30</p>
        <strong class="price">32,000원</strong>
      </div>
    </article>

    <article class="card">
      <img
        src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=900&q=85"
        alt="다양한 가을꽃으로 만든 꽃꽂이">
      <div class="content">
        <span class="category">플라워</span>
        <h3>가을꽃으로 만드는 작은 정원</h3>
        <p class="meta">도보 15분 · 매주 토요일 11:00</p>
        <strong class="price">45,000원</strong>
      </div>
    </article>
  </section>
</main>

<script>
document.querySelectorAll(".chip").forEach(button=>{
  button.onclick=()=>{
    document.querySelectorAll(".chip").forEach(item=>item.classList.remove("active"));
    button.classList.add("active");
  };
});
</script>
</body>
</html>1f
